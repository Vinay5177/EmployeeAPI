AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Employee Management System API

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.14
    Environment:
      Variables:
        ENVIRONMENT: aws
        EMPLOYEE_TABLE: Employees
        LOG_LEVEL: INFO

Resources:

  EmployeeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/us-east-1_GiPp1cmfw"
              audience:
                - 7u7e602ptgikdl4gf363oj3b2m

  EmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: employee-management-api
      CodeUri: lambda/
      Handler: lambda_function.lambda_handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: Employees

      Events:

        GetEmployees:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /employees
            Method: GET

        GetEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /employees/{employeeId}
            Method: GET

        CreateEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /employees
            Method: POST

        UpdateEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /employees/{employeeId}
            Method: PUT

        DeleteEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /employees/{employeeId}
            Method: DELETE

Outputs:

  EmployeeApiUrl:
    Description: Employee Management API URL
    Value: !Sub 'https://${EmployeeApi}.execute-api.${AWS::Region}.amazonaws.com'

  EmployeeFunctionArn:
    Description: Employee Lambda Function ARN
    Value: !GetAtt EmployeeFunction.Arn

  EmployeeTableName:
    Description: DynamoDB Employee Table Name
    Value: Employees